<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A9BF0"/>
      <stop offset="1" stop-color="#005FB8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F2FC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#002B55" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- lembar laporan -->
  <g filter="url(#shadow)">
    <path d="M150 92 h158 l64 64 v236 a28 28 0 0 1 -28 28 h-194 a28 28 0 0 1 -28 -28 v-272 a28 28 0 0 1 28 -28 z" fill="url(#paper)"/>
    <path d="M308 92 v44 a20 20 0 0 0 20 20 h44 z" fill="#B9D7F3"/>
  </g>
  <!-- baris tabel log -->
  <rect x="166" y="190" width="150" height="20" rx="10" fill="#0078D4"/>
  <rect x="166" y="232" width="176" height="16" rx="8" fill="#9CC6EE"/>
  <rect x="166" y="266" width="140" height="16" rx="8" fill="#9CC6EE"/>
  <rect x="166" y="300" width="110" height="16" rx="8" fill="#9CC6EE"/>
